name: Data Vault CI Quality Checks

# Trigger the workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code into the runner container
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Configure Python on the virtual machine
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install all pipeline dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Install dbt packages (AutomateDV)
      - name: Install dbt packages
        run: |
          cd ecommerce_dv
          dbt deps

      # Step 5: Run the Ingestion & Data Vault Transformation
      - name: Execute Pipeline Ingestion
        run: |
          python pipeline.py

      # Step 6: Run Data Quality Tests
      - name: Execute dbt Data Quality Assertions
        run: |
          cd ecommerce_dv
          dbt test